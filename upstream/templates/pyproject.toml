[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[project]
name = "apache-ossie-neo4j"
version = "0.1.0"
description = "Neo4j Ontology Graph Spec ↔ Apache Ossie converters"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Ontology",
    "Neo4j",
    "Graph",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie-converters/"

[project.scripts]
ossie-neo4j = "ossie_neo4j.cli:main"

[project.entry-points."ossie.vendor_validators"]
NEO4J = "ossie_neo4j.vendor:check"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_neo4j"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]
